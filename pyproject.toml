[project]
name = "secure-agentic-rag"
version = "0.1.0"
description = "Secure Agentic RAG platform — prompt-injection defense, LangGraph multi-agent, MCP tools, eval harness, Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # ── Agent / orchestration ──────────────────────────────────────────────
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-ollama>=0.2",
    "langchain-community>=0.3",

    # ── MCP (Model Context Protocol) ──────────────────────────────────────
    "mcp>=1.0",

    # ── Vector store ──────────────────────────────────────────────────────
    "chromadb>=0.5",

    # ── Config / utilities ────────────────────────────────────────────────
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",

    # ── Eval + ML (classifier stretch) ────────────────────────────────────
    "scikit-learn>=1.5",
    "numpy>=1.26",

    # ── Dashboard ─────────────────────────────────────────────────────────
    "streamlit>=1.36",
    "plotly>=5.22",

    # ── Testing ───────────────────────────────────────────────────────────
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
